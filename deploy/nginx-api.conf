# nginx reverse proxy for the LAMID ONE API.
#
# Install: copy to /etc/nginx/conf.d/api.conf, then run
# `certbot --nginx -d api.lamidconsulting.com` — certbot rewrites this file in place to add the
# 443 server block and an automatic 80->443 redirect. Don't hand-add SSL directives yourself
# first; let certbot do it so its renewal hook matches what it wrote.

server {
    listen 80;
    listen [::]:80;
    server_name api.lamidconsulting.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
