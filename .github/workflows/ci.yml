name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamid_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: lamid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamid_test -d lamid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lamid_test:local_ci_only@127.0.0.1:5432/lamid_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/stress-worker-races.mjs && node scripts/stress-reward-claims.mjs && node scripts/stress-spending.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
