<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1A2B" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Think clearly. Build capability. Make consistent progress. LAMID ONE brings your context, decisions, and actions together."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LAMID ONE — Progress, with intention.</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lamid-theme');
          if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
